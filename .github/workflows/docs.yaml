name: Documentation 📚

on:
  push:
    branches: ["main", "public-main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
       image: python:3.11-slim
    steps:
      - name: setup
        run: |
          apt-get update && apt-get install -y \
          coreutils \
          git \
          ffmpeg \
          gcc \
          pkg-config \
          libcairo2-dev \
          libpango1.0-dev \
          fonts-dejavu-core
          git config --system --add safe.directory $GITHUB_WORKSPACE

      - name: checkout code 📦
        uses: actions/checkout@v5

      - name: install uv
        uses: astral-sh/setup-uv@v7

      - name: setup env
        run: uv sync --group docs --frozen

      - name: render animation 🎞️
        run: |
          uvx manim@0.20.1 -qh --media_dir /tmp/anim \
          docs/animations/fwd_anim.py StreamingMessagePassing
          mkdir -p docs/_static
          cp /tmp/anim/videos/fwd_anim/1080p60/StreamingMessagePassing.mp4 \
          docs/_static/streaming_message_passing.mp4

      - name: build documentation 🔨
        run: uv run --no-sync sphinx-build -W -b html docs/ site/

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
