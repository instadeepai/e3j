formats:
  - png
  - svg

modules:
  LinearBenchmark:
    skip: True
    grid:
      l_max: [2, 4, 6]
      mul: [32, 128]
      batch_size: [128, 256, 512, 1024, 2048]
      n_it: [5000]

    seaborn:
      style: mul

    log_xy: True

  HarmonicsBenchmark:
    skip: True
    grid:
      l_max: [3, 6, 8]
      batch_size: [128, 256, 512, 1024, 2048]
      n_it: [5000]

    log_xy: True

  TensorProductBenchmark:
    skip: False

    grid:
      l_max: [3]
      batch_size:
        - 256

      n_it: [500]

    log_xy: True

  SymmetricContractionBenchmark:
    skip: True

    grid:
      # Input l_max (not module l_max pruning intermediate irreps)
      l_max: [2, 3]
      correlation: [2, 3]
      num_channels: [4, 8, 16]
      num_species: [10]
      batch_size: [128, 256, 512]
      n_it: [500]

    log_xy: True

grid-defaults:
  batch_size: [256, 512, 1024]
  n_it: [100]
