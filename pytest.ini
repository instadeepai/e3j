[pytest]
testpaths = tests
addopts = -m "not e3j_ops and not mosaic_tpu and not multi_devices"
env =
    JAX_DEFAULT_MATMUL_PRECISION=highest
markers =
    mosaic_gpu: Pallas Mosaic GPU kernels (needs a CUDA jaxlib; skips below sm_90)
    slow
    tolerated: passing with high tolerance only
    e3j_ops: build and run requires GPU
    mosaic_tpu: run require TPU
    mosaic_gpu: run requires a Hopper (sm_90) or newer GPU
    multi_devices: test that require multiple devices
